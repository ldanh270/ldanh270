name: Update All Commits Badge

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    name: Update all-time commit count
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: ldanh270
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Generate all-commits badge data
        run: python3 scripts/update_all_commits_badge.py

      - name: Commit updated badge
        run: |
          if git diff --quiet -- .github/badges/all-commits.json; then
            echo "The all-commits badge is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/all-commits.json
          git commit -m "chore: update all-commits badge [skip ci]"
          git push
