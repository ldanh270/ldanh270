name: Update Profile SVGs (Dynamic Uptime)

on:
  schedule:
    - cron: '0 0 * * *' # Chạy tự động mỗi ngày lúc 00:00 UTC
  workflow_dispatch: # Cho phép trigger bằng tay qua GitHub UI
  push:
    branches:
      - main
    paths:
      - 'gen_svg.py'
      - 'ref/**'

jobs:
  update-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pillow

      - name: Regenerate SVGs
        run: |
          python gen_svg.py

      - name: Commit & Push updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || (git commit -m "chore(auto): update uptime & profile SVGs [skip ci]" && git push)
